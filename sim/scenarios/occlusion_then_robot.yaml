name: occlusion_then_robot
description: A trolley parked across the aisle hides the bay from its camera for 35 minutes while the rice row sells out; the robot can still get close.
expect: No alert while only the camera's view is blocked. At 10:20 (blocked 15 min) a mission goes to G1-L-04; the robot reads the empty rice row, so OUT and a RESTOCK task follow before the camera sees again at 10:40.
start: "10:00"
end: "10:50"
bays: [G1-L-04]
stock: {RICE_1KG: {backroom: 100}}
events:
  - {at: "10:05", do: occlude, bay: G1-L-04, x: [0.0, 120.0], until: "10:40", source: camera}
  - {at: "10:10", do: sell, bay: G1-L-04, row: 2, position: 0, qty: 84}
