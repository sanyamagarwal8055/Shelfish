# Vision track settings (owned by Vision). Every tunable perception number lives here.

# Fixed shelf cameras, mounted on the opposite side of the aisle (README 5.1, camera_planner).
camera_plan:
  hfov_deg: 90 # horizontal field of view
  sensor_px: 4000 # horizontal pixels
  min_px_per_cm: 10 # bay images must keep at least 10 px/cm
  max_angle_deg: 35 # max viewing angle off the shelf normal
  overlap_m: 0.2 # shared strip between neighbouring cameras

# Lens model for synthetic --distort frames (tools/synth barrel). Real cameras get K + dist from
# calibration instead.
rectify:
  synth_k1: 0.12

# Shelf rows from rail detection.
shelves:
  rail_cm: 3.0 # rail height; row pitch comes from configs/store_layout.yaml
  rail_band_cm: [1.5, 4.5] # a horizontal band this tall with full-width edges is a rail
  edge_thr: 40 # Sobel |dI/dy| for a strong horizontal edge
  min_cover: 0.4 # fraction of the width a rail edge must span
  occlusion_tol: 45 # colour distance from the rail's own colour that means "something in front"
  min_occlusion_cm: 5
  depth_margin_mm: 50 # with a depth map: this much closer than the shelf edge = in front of it
  depth_cover: 0.05 # share of a column's row pixels in front of the edge that marks it occluded

detector:
  backend: classic # classic (OpenCV baseline, synthetic only) | yolo (real photos)
  weights: data/models/sku110k_yolo.pt # git-ignored; train with training/train_sku110k.py
  conf: 0.25
  imgsz: 1280
  row_tolerance_cm: 8 # a box's bottom must be this close to a shelf surface
  classic:
    bg_tol: 40
    band_cm: [1.0, 4.0]
    min_pack_cm: 2.0
    edge_thr: 40
    edge_cover: 0.8
    conf: 0.5

quality:
  sharp_ref_var: 100 # Laplacian variance of a sharp bay image

# Which product is each pack (step 5): gallery search re-ranked by location + size.
identify:
  backend: dinov2 # dinov2 | clip
  model: null # null = the backend's default (facebook/dinov2-small, openai/clip-vit-base-patch32)
  input_px: 224 # crop size fed to the model; smaller is faster, less accurate
  gallery: data/gallery
  index_dir: runs/gallery_index # built by scripts/build_gallery_index.py (git-ignored)
  # Planogram / label-map JSON read as a location hint; first folder with <bay_id>.json wins.
  planogram_dirs: [data/planograms, data/label_maps, contracts/fixtures/demo_store/planograms]
  top_k: 5
  unknown_below: 0.5 # best cosine similarity below this -> UNKNOWN
  ambiguous_margin: 0.02 # top two scores closer than this -> AMBIGUOUS:a|b
  location_bonus: 0.05 # added when the SKU is the one planned at that x
  size_bonus: 0.05 # times size_match (pack width vs sku_master)
  size_tol: 0.25

# depth_left from an aligned depth map (step 6). Shelf depth comes from configs/store_layout.yaml.
depth:
  mm_per_unit: 1.0 # depth map units (uint16 mm from the camera; 0 = no reading)
  round_tol: 0.15 # packs of measurement noise absorbed before rounding up
  min_valid_frac: 0.3 # share of a region that must have a reading
