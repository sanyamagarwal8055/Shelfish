# Brain settings (owned by the Brain track). Loaded by shelfpulse.brain.load_brain_config().
# Shared robot limits (sweeps, max_bays, max_per_hour, blackout, camera_blocked_min) stay in
# configs/robot.yaml.

planograms:
  # Searched in order; first <bay_id>.json wins (digital planogram beats robot label map).
  # The demo_store fixture is last so the demo bays work before a store's own data exists.
  dirs: [data/planograms, data/label_maps, contracts/fixtures/demo_store/planograms]

tracker:
  k: 2 # raise OUT/LOW when k of the last n trusted frames agree
  n: 3
  clear_after: 2 # consecutive OK frames to resolve
  robot_overrides: true # one trusted robot frame raises or resolves on its own

fusion:
  conflict_window_s: 300 # camera vs robot disagree within this window -> slot unsure + mission

blocked:
  occluded_frac: 0.5 # bay counts as blocked if more than this fraction is occluded (or quality < 0.5)

missions:
  footfall_tx_per_10min_max: 25 # no missions while POS sales in the last 10 min exceed this

diagnosis: # why a slot is empty, checked in this order: theft, restock, phantom, stockout
  theft_window_min: 10 # look this far back before the alert for a sudden drop
  theft_min_units: 5 # a drop this big ...
  theft_max_sales_frac: 0.2 # ... with at most this share of it sold at the till = theft
  phantom_min_units: 5 # system on-hand minus shelves minus backroom >= this = wrong count

quantity: # sales-based estimate, used only where the cameras can't see depth
  restock_lead_h: 0.5 # staff need this long to refill once told
  safety_units: 2 # LOW_ESTIMATED when the estimate < velocity x lead time + this

priority: # rupees lost per hour = velocity (packs/h) x margin (Rs/pack)
  velocity_window_h: 168 # trailing sales window (7 days)
  min_velocity_span_h: 1.0 # never divide by less than this, so a short history isn't inflated
  low_weight: 0.5 # a LOW slot still sells: count half its rate
  p1_min_rupees_per_h: 100
  p2_min_rupees_per_h: 20
  min_priority: { LOSS_PREVENTION: P1, CYCLE_COUNT: P2, REORDER: P2 }

sim: # store simulator (sim/): how the fake Vision track reports
  camera_interval_s: 60 # locked design: 1 frame per minute
  camera_quality: 0.92
  robot_quality: 0.95
  conf: 0.95 # pack confidence for a clearly identified pack
  ambiguous_conf: 0.55
